<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的旅遊行程</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; background-color: #f9f9f9; color: #333; }
    h1 { text-align: center; color: #007bff; }
    .day-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .day-title { font-size: 1.2rem; font-weight: bold; background: #007bff; color: white; padding: 8px 12px; border-radius: 5px; margin-bottom: 15px; }
    .spot { border-left: 3px solid #007bff; padding-left: 12px; margin-bottom: 15px; }
    .time { font-weight: bold; color: #666; font-size: 0.9rem; }
    .spot-name { font-size: 1.1rem; font-weight: bold; margin: 3px 0; }
    .note { color: #555; font-size: 0.95rem; margin: 0; }
  </style>
</head>
<body>

  <h1>✈️ 我的旅遊行程</h1>

  <div class="day-card">
    <div class="day-title">Day 1 - 2026/10/10</div>
    
    <div class="spot">
      <div class="time">09:00</div>
      <div class="spot-name">桃園國際機場</div>
      <p class="note">辦理登機手續、領取 eSIM 與換匯。</p>
    </div>

    <div class="spot">
      <div class="time">13:00</div>
      <div class="spot-name">抵達飯店 Check-in</div>
      <p class="note">寄放行李，準備出門吃午餐。</p>
    </div>
  </div>

  <div class="day-card">
    <div class="day-title">Day 2 - 2026/10/11</div>
    
    <div class="spot">
      <div class="time">10:00</div>
      <div class="spot-name">著名景點參觀</div>
      <p class="note">預計停留 2 小時，記得拍照！</p>
    </div>
  </div>

</body>
</html>
